name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch so a new push cancels the stale run.
  # Everything else (master, tags) gets a unique group and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Plain `pip install .` against the distro's xerces-c, for oldest and newest
  # supported Python. The platform wheels below are each built and tested
  # (via `[tool.cibuildwheel] test-command`) by cibuildwheel.
  source_build:
    name: Source build (Ubuntu, python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libxerces-c-dev

      - name: Install package
        run: python -m pip install . pytest

      - name: Run tests
        run: python -m pytest tests

  build_wheels:
    name: Wheel (${{ matrix.platform.name }}, ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: [cp311, cp312, cp313, cp314, cp315]
        platform:
          - name: linux
            os: ubuntu-latest
            build: "{0}-manylinux_x86_64"
          - name: windows
            os: windows-2022
            # The glob also picks up the free-threaded variant (cp314t, cp315t) where
            # cibuildwheel enables it; an explicit "cp311t" selector is rejected.
            build: "{0}*-win_amd64"
          - name: macos
            os: macos-latest
            build: "{0}-macosx_*"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ format(matrix.platform.build, matrix.python) }}
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.11, <3.16"
          CIBW_BEFORE_ALL_LINUX: "bash scripts/install_xerces_c.sh"
          CIBW_BEFORE_ALL_MACOS: "bash scripts/install_xerces_c.sh"
          CIBW_BEFORE_ALL_WINDOWS: "powershell scripts/install_xerces_c.ps1"
          # cibuildwheel 4.0 runs delvewheel by default on Windows, which can't find the
          # xerces-c DLL; setup.py already bundles it into the wheel, so skip the repair.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.name }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Install each wheel on a fresh runner with no Xerces-C on the system, to prove
  # the bundled library is actually picked up (cibuildwheel's own test runs on
  # the build machine, where Xerces-C is installed system-wide).
  test_wheels:
    name: Clean-runner wheel test (${{ matrix.platform.name }}, python ${{ matrix.python-version }})
    needs: build_wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
        platform:
          - { name: linux, os: ubuntu-latest }
          - { name: windows, os: windows-2022 }
          - { name: macos, os: macos-latest }

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-${{ matrix.platform.name }}-*
          merge-multiple: true
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --find-links dist pye57
          python -m pip install pye57 pytest

      - name: Run tests
        run: python -m pytest tests

  make_sdist:
    name: Make sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_all:
    name: Upload to PyPI
    needs: [source_build, build_wheels, test_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
